# Référence du schéma des secrets attendus par les manifests de k8s/ —
# JAMAIS appliqué tel quel, jamais de vraies valeurs ici. Les vrais secrets
# sont créés une fois via des commandes kubectl impératives (cf.
# specs/009-deploiement-k8s/quickstart.md, étape 3), jamais commités.

apiVersion: v1
kind: Secret
metadata:
  name: skillforge-postgres
  namespace: skillforge
type: Opaque
stringData:
  POSTGRES_USER: <GENERATE_ME>
  POSTGRES_PASSWORD: <GENERATE_ME> # openssl rand -base64 32
  POSTGRES_DB: skillforge
---
apiVersion: v1
kind: Secret
metadata:
  name: skillforge-minio
  namespace: skillforge
type: Opaque
stringData:
  MINIO_ROOT_USER: <GENERATE_ME>
  MINIO_ROOT_PASSWORD: <GENERATE_ME> # openssl rand -base64 32
---
apiVersion: v1
kind: Secret
metadata:
  name: skillforge-api
  namespace: skillforge
type: Opaque
stringData:
  JWT_SIGNING_KEY: <GENERATE_ME> # openssl rand -base64 48
---
# Créé via `kubectl create secret docker-registry`, pas via un manifest
# stringData (le format dockerconfigjson n'est pas pratique à écrire à la
# main) :
#
#   kubectl -n skillforge create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT read:packages>
