apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: skillforge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/matteobadet/skillforge-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: skillforge-postgres
            - secretRef:
                name: skillforge-minio
            - secretRef:
                name: skillforge-api
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_PUBLIC_ENDPOINT
              value: storage.skillforge.mbadet.fr
            - name: MINIO_PUBLIC_USE_SSL
              value: "true"
            - name: MINIO_BUCKET_AVATARS
              value: avatars
            - name: MINIO_BUCKET_RESOURCES
              value: resources
            - name: MINIO_BUCKET_ICONS
              value: icons
            - name: JWT_ISSUER
              value: skillforge
            - name: FRONTEND_ORIGIN
              value: https://skillforge.mbadet.fr
          resources:
            requests:
              memory: 150Mi
              cpu: 100m
            limits:
              memory: 350Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
