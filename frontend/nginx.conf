server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets Vite sont fingerprintés (hash dans le nom de fichier) : cache long et immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html référence ces noms hashés — il ne doit jamais rester en cache,
    # sinon un navigateur peut continuer à charger un ancien bundle après déploiement.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
