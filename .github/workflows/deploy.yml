name: Deploy

# Build + publie les images sur GHCR à chaque push sur main touchant le
# backend ou le frontend, puis met à jour le déploiement k3s existant sur
# le VPS (kubectl set image + rollout status). Ne recrée jamais les
# manifests (k8s/ n'est appliqué que manuellement, cf. quickstart.md) —
# ce workflow gère uniquement les mises à jour d'image en routine.
#
# Secret requis (repo settings > Secrets and variables > Actions) :
#   VPS_SSH_PRIVATE_KEY — clé privée dédiée au déploiement (pas la clé
#   personnelle), dont la clé publique est déjà dans
#   ~/.ssh/authorized_keys de l'utilisateur ubuntu sur le VPS.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/skillforge-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skillforge-frontend
  VPS_HOST: 152.228.239.129
  VPS_USER: ubuntu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend/SkillForge.Api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          build-args: |
            VITE_API_URL=https://api.skillforge.mbadet.fr
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Update deployment on the VPS
        run: |
          SHA_TAG="${{ needs.build-and-push.outputs.sha_tag }}"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            set -e
            sudo k3s kubectl -n skillforge set image deployment/api api=$API_IMAGE:$SHA_TAG
            sudo k3s kubectl -n skillforge set image deployment/frontend frontend=$FRONTEND_IMAGE:$SHA_TAG
            sudo k3s kubectl -n skillforge rollout status deployment/api --timeout=120s
            sudo k3s kubectl -n skillforge rollout status deployment/frontend --timeout=120s
          "
